# ============================================================
# Secret - nơi cất THÔNG TIN BÍ MẬT (password, token, api key, chứng chỉ)
#
# Dùng y hệt ConfigMap, chỉ khác ở chỗ CHỨA GÌ:
#     ConfigMap -> cấu hình công khai (port, url, log level)
#     Secret    -> password, token, key
#
# ⚠️ Secret CHỈ mã hóa base64 - KHÔNG PHẢI mã hóa thật:
#       echo "MTIzNDU2" | base64 -d     ->  123456
#    Ai đọc được Secret là thấy hết. Nó chỉ giúp không lộ khi in log.
#
# ⛔ FILE NÀY CHỨA PASSWORD MẪU -> ĐỪNG commit file có password THẬT lên git.
#    Thêm secret.yaml vào .gitignore, hoặc dùng Sealed Secrets / External Secrets.
# ============================================================

apiVersion: v1            # Secret là object "core" -> luôn là v1
kind: Secret              # Loại object muốn tạo

metadata:
  name: db-secret         # ⭐ TỰ ĐẶT - NHỚ KỸ tên này.
                          # Deployment sẽ gọi lại đúng tên này ở:
                          #   secretKeyRef.name / secretRef.name / volumes.secret.secretName
                          # Gọi sai -> Pod kẹt ở CreateContainerConfigError

  namespace: default      # PHẢI CÙNG namespace với Pod dùng nó.
                          # Secret KHÔNG dùng chéo namespace được.

  labels:
    app: nginx            # TỰ ĐẶT, chỉ để lọc: kubectl get secret -l app=nginx

type: Opaque              # Opaque = loại mặc định, tự do đặt key/value (hay dùng nhất).
                          # Các loại khác:
                          #   kubernetes.io/tls                  -> chứng chỉ HTTPS (Ingress)
                          #   kubernetes.io/dockerconfigjson     -> login registry private
                          #   kubernetes.io/basic-auth           -> cặp username/password

# ------------------------------------------------------------
# CÓ 2 CÁCH GHI GIÁ TRỊ. Dùng chung trong 1 file cũng được.
# ------------------------------------------------------------

# ===== CÁCH 1: stringData - ghi CHỮ THƯỜNG, k8s tự mã hóa  <- NÊN DÙNG =====
stringData:
  DB_USERNAME: "admin"
  DB_PASSWORD: "S3cr3tP@ss"      # ghi thẳng, không cần base64
  API_KEY: "sk-abc123xyz"
  DB_URL: "mysql://admin:S3cr3tP@ss@mysql-service:3306/mydb"

  # Sau khi apply, đọc lại bằng -o yaml sẽ thấy k8s đã chuyển hết
  # xuống mục "data" dưới dạng base64. stringData chỉ tồn tại lúc ghi vào.

# ===== CÁCH 2: data - PHẢI tự mã hóa base64 trước =====
data:
  # Tạo chuỗi base64 bằng lệnh:
  #     echo -n "admin"  | base64     ->  YWRtaW4=
  #     echo -n "123456" | base64     ->  MTIzNDU2
  #
  # ⚠️ Cờ -n CỰC KỲ QUAN TRỌNG.
  #    Thiếu -n, chuỗi sẽ dính thêm ký tự xuống dòng \n
  #    -> password sai mà nhìn bằng mắt KHÔNG phát hiện ra. Lỗi rất khó debug.

  legacy_user: YWRtaW4=           # = "admin"
  legacy_pass: MTIzNDU2           # = "123456"

  # Giải mã ngược để kiểm tra:
  #     echo "MTIzNDU2" | base64 -d

# ⚠️ Một key CHỈ được nằm ở stringData HOẶC data, không được cả hai.
#    Trùng key -> stringData thắng, giá trị bên data bị bỏ qua.

# ============================================================
# CÁCH GẮN VÀO POD - chép phần dưới vào deployment.yaml
# (đặt trong spec.template.spec.containers)
# ------------------------------------------------------------
#
# KIỂU A - lấy TỪNG biến (rõ ràng, dễ kiểm soát):
#
#     env:
#     - name: DB_PASSWORD             # tên biến BÊN TRONG container (tự đặt)
#       valueFrom:
#         secretKeyRef:               # <- ConfigMap thì là configMapKeyRef
#           name: db-secret           # <- metadata.name ở trên
#           key: DB_PASSWORD          # <- key trong stringData/data ở trên
#
#
# KIỂU B - nạp HẾT thành biến môi trường (gọn nhưng lộ nhiều):
#
#     envFrom:
#     - secretRef:
#         name: db-secret
#
#
# KIỂU C - gắn thành FILE (AN TOÀN NHẤT - nên dùng cho production):
#
#     volumeMounts:
#     - name: secret-volume
#       mountPath: /etc/secrets       # thư mục file sẽ xuất hiện
#       readOnly: true                # nên bật
#     ...
#     (ngang hàng với containers:)
#     volumes:
#     - name: secret-volume
#       secret:
#         secretName: db-secret       # ⚠️ ở đây là "secretName"
#                                     #    ConfigMap thì viết "name" - RẤT DỄ NHẦM
#         defaultMode: 0400           # chỉ chủ sở hữu đọc được
#
#   => trong container có file /etc/secrets/DB_PASSWORD, nội dung là password
#
#   VÌ SAO KIỂU C AN TOÀN HƠN A/B:
#     - Biến môi trường dễ lộ: chạy `env` trong container là thấy hết,
#       lỡ app in log lúc crash cũng lộ, `kubectl describe pod` cũng thấy tên biến.
#     - File thì phải đọc đúng đường dẫn mới thấy.
#
# ============================================================
# BẢNG TÓM TẮT: ConfigMap vs Secret (chỗ hay nhầm)
# ------------------------------------------------------------
#                    ConfigMap            Secret
#   ghi thẳng chữ:   data                 stringData
#   lấy 1 biến:      configMapKeyRef      secretKeyRef
#   lấy hết biến:    configMapRef         secretRef
#   trong volumes:   configMap.name       secret.secretName
# ============================================================
#
# CÁC LỆNH ĐỂ THỰC HÀNH:
#   kubectl apply -f secret.yaml
#   kubectl get secret                                # chỉ hiện TÊN + SỐ KEY, không hiện giá trị
#   kubectl describe secret db-secret                 # cũng chỉ hiện số byte
#   kubectl get secret db-secret -o yaml              # thấy base64 (chưa đọc được)
#
# ĐỌC NGƯỢC GIÁ TRỊ THẬT:
#   kubectl get secret db-secret -o jsonpath='{.data.DB_PASSWORD}' | base64 -d
#
# KIỂM TRA ĐÃ VÀO CONTAINER CHƯA:
#   kubectl exec -it <ten-pod> -- env | grep DB_PASSWORD
#   kubectl exec -it <ten-pod> -- cat /etc/secrets/DB_PASSWORD
#
# TẠO NHANH KHÔNG CẦN FILE YAML (an toàn hơn - password không nằm trong file):
#   kubectl create secret generic db-secret \
#       --from-literal=DB_USERNAME=admin \
#       --from-literal=DB_PASSWORD=S3cr3tP@ss
#   ⚠️ nhưng lệnh này bị lưu vào ~/.zsh_history -> cẩn thận khi dùng máy chung
#
# ⚠️ SỬA FILE NÀY XONG, POD KHÔNG TỰ CẬP NHẬT (nếu gắn kiểu env):
#   kubectl apply -f secret.yaml
#   kubectl rollout restart deployment nginx-deployment    # bắt buộc
#
# XÓA:
#   kubectl delete -f secret.yaml

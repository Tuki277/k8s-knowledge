apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: micro-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, version: v1 }
    spec:
      containers:
        - name: frontend
          image: ${REGISTRY}/lab3-frontend:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: micro-demo
spec:
  selector: { app: frontend }
  ports:
    - { name: http-web, port: 80, targetPort: 80 }

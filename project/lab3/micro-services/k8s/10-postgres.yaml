apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: micro-demo
stringData:
  POSTGRES_PASSWORD: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: micro-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: demo }
          envFrom:
            - secretRef: { name: postgres-secret }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}   # lab: mất data khi pod restart
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: micro-demo
spec:
  selector: { app: postgres }
  ports:
    - { name: tcp-postgres, port: 5432, targetPort: 5432 }

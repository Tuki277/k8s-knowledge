# Istio ingress thay cho nginx gateway: route theo path
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: micro-gateway
  namespace: micro-demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: micro-routes
  namespace: micro-demo
spec:
  hosts: ["*"]
  gateways: [micro-gateway]
  http:
    - match: [{ uri: { prefix: /api/users } }]
      rewrite: { uri: /users }
      route:
        - destination: { host: user-service, port: { number: 3001 } }
    - match: [{ uri: { prefix: /api/visits } }]
      rewrite: { uri: /visits }
      route:
        - destination: { host: visit-service, port: { number: 3002 } }
    - route:
        - destination: { host: frontend, port: { number: 80 } }
---
# mTLS bắt buộc giữa các service trong namespace
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: micro-demo
spec:
  mtls:
    mode: STRICT

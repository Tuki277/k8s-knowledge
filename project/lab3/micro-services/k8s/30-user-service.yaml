apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: micro-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service, version: v1 }
    spec:
      containers:
        - name: user-service
          image: ${REGISTRY}/lab3-user-service:${TAG}
          imagePullPolicy: Always
          env:
            - { name: PG_HOST, value: postgres }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: micro-demo
spec:
  selector: { app: user-service }
  ports:
    - { name: http-user, port: 3001, targetPort: 3001 }

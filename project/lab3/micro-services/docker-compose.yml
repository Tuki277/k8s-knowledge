services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
  redis:
    image: redis:7-alpine

  user-service:
    build: ./user-service
    environment:
      PG_HOST: postgres
      PG_PASSWORD: postgres
    depends_on: [postgres]

  visit-service:
    build: ./visit-service
    environment:
      REDIS_HOST: redis
    depends_on: [redis]

  gateway:
    build: ./gateway
    ports: ["8080:80"]
    depends_on: [user-service, visit-service]

  frontend:
    build: ./frontend
    ports: ["3000:80"]

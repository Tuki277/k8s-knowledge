global:
  clusterName: "docker-desktop-lab"
  deploymentEnvironment: "lab"
  otelCollectorEndpoint: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
  otelInsecure: true

presets:
  otlphttpExporter:
    enabled: true
  loggingExporter:
    enabled: false

otelAgent:
  config:
    receivers:
      filelog/k8s:
        include: [ /var/log/containers/*.log ]
        include_file_name: false
        include_file_path: true
        operators:
          - type: container
            id: container-parser


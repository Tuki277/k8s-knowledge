# KHÔNG nằm trong manifests/ nên Argo không sync file này.
# Sửa giá trị rồi apply thủ công: kubectl apply -n lab2 -f secret.example.yaml
# (không commit bản chứa mật khẩu thật lên git)
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: lab2
type: Opaque
stringData:
  DB_HOST: postgresql.postgresql.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: lab2
  DB_USER: postgres
  DB_PASSWORD: CHANGE_ME
  REDIS_URL: redis://redis-master.redis.svc.cluster.local:6379
  REDIS_PASSWORD: CHANGE_ME
  PORT: "3000"

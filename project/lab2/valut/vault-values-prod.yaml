# vault-values-prod.yaml
global:
  enabled: true
  tlsDisable: true   # Tắt TLS cho lab (production nên bật)

server:
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }
  service:
    type: ClusterIP
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: hostpath

ui:
  enabled: true

injector:
  enabled: true